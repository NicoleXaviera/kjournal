    .yr-rank { display: inline-flex; align-items: center; gap: .55rem; font-size: .9rem; font-weight: 700; }
    .yr-rank b { display: grid; place-items: center; min-width: 2.1rem; height: 2.1rem; padding: 0 .4rem; border-radius: 8px; background: var(--rose); font-size: 1.05rem; font-weight: 800; }
    .ws-yr h2 { font-size: clamp(2.6rem, 7vw, 5.4rem); font-weight: 800; letter-spacing: -0.05em; line-height: .95; margin: .8rem 0 .9rem; }
    .yr-quote { font-size: clamp(1rem, 1.6vw, 1.2rem); font-style: italic; color: rgba(255,255,255,.85); max-width: 46ch; line-height: 1.45; }
    .yr-moods { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
    .yr-moods span { padding: .35rem .75rem; border-radius: 999px; background: rgba(255,255,255,.14); backdrop-filter: blur(8px); font-size: .8rem; font-weight: 600; }
    .yr-row { position: relative; z-index: 2; display: flex; gap: .7rem; overflow-x: auto; scrollbar-width: none; padding: .5rem clamp(1.4rem, 5vw, 4rem) calc(2rem + env(safe-area-inset-bottom)); }
    .yr-row::-webkit-scrollbar { display: none; }
    .yr-th { position: relative; flex: 0 0 180px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #241a29; text-align: left; opacity: .55; transform: scale(.94); transform-origin: bottom; transition: opacity 300ms ease, transform 400ms var(--ease-out), box-shadow 300ms ease; padding: 0; color: #fff; }
    .yr-th img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
    .yr-th span { position: absolute; left: .55rem; right: .55rem; bottom: .5rem; font-size: .76rem; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yr-th::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.65), transparent 60%); }
    .yr-th span { z-index: 1; }
    .yr-th.on { opacity: 1; transform: none; box-shadow: 0 0 0 2px #fff; }
    .yr-th i { position: absolute; z-index: 2; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--rose); transform: scaleX(0); transform-origin: left; }
    .yr-th.on i { animation: fill 5.5s linear forwards; }
    .ws-yr:not(.in) .yr-th.on i, .yr-row:hover .yr-th.on i { animation-play-state: paused; }
    @media (max-width: 640px) { .yr-th { flex-basis: 128px; } .yr-shade { background: linear-gradient(0deg, #0d090f 10%, rgba(13,9,15,.75) 50%, rgba(13,9,15,.15) 80%); } }
    @media (prefers-reduced-motion: reduce) { .bb-slide img, .yr-bg img { transition: none; transform: none; } .bb-body > *, .yr-body > * { animation: none; } .reveal .rail > * { opacity: 1; transform: none; transition: none; } }

    /* =========================================================
       PENSADO PARA CELULAR
       ========================================================= */
    /* Carrusel principal deslizable */
    .hc { position: relative; margin: 0 -1.25rem; padding: .5rem 0 0; overflow: hidden; }
    .hc-ambient { position: absolute; inset: 0 0 30%; z-index: 0; pointer-events: none; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 30%); mask-image: linear-gradient(transparent, #000 30%); }
    .hc-ambient img { position: absolute; inset: -20%; width: 140%; height: 140%; object-fit: cover; filter: blur(60px) saturate(1.6); opacity: .45; }
    .amb-enter-active, .amb-leave-active { transition: opacity 900ms ease; }
    .amb-enter-from, .amb-leave-to { opacity: 0; }
    .hc::after { content: ""; position: absolute; left: 0; right: 0; bottom: 30%; height: 40%; background: linear-gradient(transparent, var(--paper)); pointer-events: none; z-index: 0; }
    .hc-track { --cw: min(76vw, 320px); position: relative; z-index: 1; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 1rem calc(50% - var(--cw) / 2) 1.4rem; overscroll-behavior-x: contain; perspective: 1200px; }
    .hc-track::-webkit-scrollbar { display: none; }
    .hc-card { position: relative; flex: 0 0 var(--cw); aspect-ratio: 2/3; border-radius: 24px; overflow: hidden; scroll-snap-align: center; scroll-snap-stop: always; background: #241a29; cursor: pointer;
      transform: rotateY(calc(var(--s) * -10deg)) scale(calc(1 - var(--d) * .13)); opacity: calc(1 - var(--d) * .35);
      box-shadow: 0 calc(24px - var(--d) * 14px) calc(50px - var(--d) * 30px) rgba(29,22,34,.35); will-change: transform; user-select: none; -webkit-user-select: none; }
    .hc-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .hc-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(12,8,15,.95) 0%, rgba(12,8,15,.55) 34%, rgba(12,8,15,0) 58%); }
    .hc-badge { position: absolute; z-index: 2; left: 14px; top: 14px; padding: .35rem .7rem; border-radius: 999px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); color: var(--ink); font-size: .72rem; font-weight: 800; opacity: calc(1 - var(--d) * 2); }
    .hc-info { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 1rem 1rem 1.1rem; color: #fff; opacity: calc(1 - var(--d) * 2.2); transform: translateY(calc(var(--d) * 20px)); }
    .hc-info h3 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: .35rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hc-meta { display: flex; flex-wrap: wrap; gap: .2rem .7rem; font-size: .8rem; color: rgba(255,255,255,.75); font-weight: 600; margin-bottom: .85rem; }
    .hc-meta .match { color: #4be08f; font-weight: 800; }
    .hc-actions { display: grid; grid-template-columns: 1.25fr 1fr; gap: .5rem; }
    .hc-add, .hc-more { min-height: 46px; border-radius: 14px; font-weight: 800; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; transition: transform 140ms var(--ease-out), background-color 200ms ease, color 200ms ease; }
    .hc-add { background: #fff; color: var(--ink); }
    .hc-add .icon { font-size: 1.15rem; }
    .hc-add.on { background: var(--rose); color: #fff; }
    .hc-more { background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(10px); }
    .hc-add:active, .hc-more:active { transform: scale(.95); }
    .hc-dots { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; padding-bottom: .5rem; }
    .hc-dots button { position: relative; width: 8px; height: 8px; padding: 0; border-radius: 99px; background: var(--star-off); overflow: hidden; transition: width 400ms var(--ease-out), background-color 300ms ease; }
    .hc-dots button::before { content: ""; position: absolute; inset: -12px -4px; }
    .hc-dots button.on { width: 30px; background: #ead9e3; }
    .hc-dots i { position: absolute; inset: 0; background: var(--rose); transform: scaleX(0); transform-origin: left; animation: fill 6s linear forwards; }
    .hc.paused .hc-dots i { animation-play-state: paused; }
    @media (min-width: 761px) { .hc { margin: 0; border-radius: 28px; } .hc-track { --cw: 300px; } .hc-info h3 { font-size: 1.7rem; } }

    /* Botón rápido + en tarjetas horizontales */
    .lc-quick { top: auto; bottom: 8px; right: 8px; z-index: 3; }
    .lc-actions .ib.more { width: auto; padding: 0 .8rem 0 .9rem; gap: .15rem; border-radius: 999px; font-size: .78rem; font-weight: 800; display: inline-flex; align-items: center; }
    @media (hover: hover) and (pointer: fine) { .lc .lc-quick { opacity: 0; } .lc:hover .lc-quick { opacity: 0; } }

    /* Barra inferior */
    .bnav { display: none; }
    @media (max-width: 760px) {
      .tabs, .topbar .wrapped-btn { display: none; }
      .topbar-inner { flex-wrap: nowrap; padding: calc(.7rem + env(safe-area-inset-top)) 1rem .7rem; }
      main { padding: 1rem 1rem calc(110px + env(safe-area-inset-bottom)); }
      .hc { margin: 0 -1rem; }
      .hc-track { --cw: min(78vw, 330px, calc((100svh - 330px) * .8)); padding-top: .6rem; }
      .hc-card { aspect-ratio: 4/5; }
      .hc-card img { object-position: center 20%; }
      .bnav { position: fixed; z-index: 45; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 24px;
        background: rgba(255,255,255,.86); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: 0 10px 30px rgba(29,22,34,.16), inset 0 0 0 1px rgba(29,22,34,.05); }
      .bnav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; min-height: 54px; color: var(--ink-3); transition: color 200ms ease; }
      .bn-ic { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; font-size: 1.3rem; transition: background-color 250ms ease, transform 200ms var(--ease-out); }
      .bn-ic .disc { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 0deg, var(--rose), #ff9ec7, #7a2bd6, var(--rose)); animation: spin 6s linear infinite; }
      .bn-l { font-size: .68rem; font-weight: 700; }
      .bnav button.on { color: var(--ink); }
      .bnav button.on .bn-ic { background: var(--rose-tint); color: var(--rose); }
      .bnav button:active .bn-ic { transform: scale(.9); }
      .toast { bottom: calc(92px + env(safe-area-inset-bottom)); }
      .bookmark { width: 38px; height: 38px; }
      .sheet { position: relative; }
      .sheet::before { content: ""; position: absolute; z-index: 5; left: 50%; top: 8px; width: 40px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.75); transform: translateX(-50%); }
      .rail.wide { grid-auto-columns: 74vw; }
      .rail.tall { grid-auto-columns: 38vw; }
      .row-head h2 { font-size: 1.2rem; }
      .search { padding: .3rem .3rem .3rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) { .hc-card { transform: none; } .hc-dots i { animation: none; } .bn-ic .disc { animation: none; } }
  </style>
</head>
<body>
  <div id="app">

    <!-- ================= SPLASH ================= -->
    <section v-if="showSplash" class="login" :class="{ leaving: login.leaving }" @pointermove="loginTilt">
      <!-- Espiral 3D de pósters -->
      <div class="hx-scene" aria-hidden="true">
        <div class="hx" :style="{ '--rx': login.rx + 'deg', '--ry': login.ry + 'deg' }">
          <div class="hx-spin">
            <div v-for="(src, i) in helixImgs" :key="i" class="hx-card"
              :style="{ '--a': (i * 26) + 'deg', '--y': ((i - helixImgs.length / 2) * 21) + 'px', '--i': i }">
              <img :src="src" alt="" />
            </div>
          </div>
        </div>
      </div>
      <div class="login-vignette" aria-hidden="true"></div>

      <header class="login-top">
        <div class="logo"><span class="kj"><b>K</b><i>Journal</i></span></div>
        <button class="lang-btn" @click="toggleLang" :aria-label="t('changeLang')">{{ lang === 'es' ? 'ES' : 'EN' }}</button>
      </header>

      <div class="login-center">
        <h1 class="login-h">
          <span class="lh-line">{{ t('loginLine1') }}</span>
          <span class="vf">
            <span class="vf-kr" aria-hidden="true">이야기</span>
            <Transition name="word" mode="out-in">
              <span :key="login.word + lang" class="vf-word" :aria-label="loginWords[login.word]">
                <span v-for="(ch, k) in Array.from(loginWords[login.word])" :key="k" class="wl" :style="{ '--k': k }" aria-hidden="true">{{ ch === ' ' ? ' ' : ch }}</span>
                <svg class="vf-line" viewBox="0 0 300 24" preserveAspectRatio="none" aria-hidden="true"><path d="M6 16C70 6 170 4 294 12M40 21c70-6 150-7 230-4" /></svg>
                <svg class="vf-heart" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34S5 24 5 14a7 7 0 0 1 15-3 7 7 0 0 1 15 3c0 10-15 20-15 20z" /></svg>
              </span>
            </Transition>
          </span>
        </h1>
        <p class="login-sub">{{ t('loginSub') }}</p>

        <form class="login-card" @submit.prevent="submitLogin" novalidate>
          <div class="lg-tabs" role="tablist">
            <span class="lg-pill" :class="{ right: login.mode === 'register' }" aria-hidden="true"></span>
            <button type="button" role="tab" :aria-selected="login.mode === 'login'" :class="{ on: login.mode === 'login' }" @click="login.mode = 'login'; login.error = ''">{{ t('signIn') }}</button>
            <button type="button" role="tab" :aria-selected="login.mode === 'register'" :class="{ on: login.mode === 'register' }" @click="login.mode = 'register'; login.error = ''">{{ t('signUp') }}</button>
          </div>

          <Transition name="fold">
            <div v-if="login.mode === 'register'" class="lg-field">
              <input id="lg-name" v-model.trim="login.name" placeholder=" " autocomplete="name" />
              <label for="lg-name">{{ t('yourName') }}</label>
            </div>
          </Transition>
          <div class="lg-field">
            <input id="lg-email" v-model.trim="login.email" type="email" placeholder=" " autocomplete="email" />
            <label for="lg-email">{{ t('email') }}</label>
          </div>
          <div class="lg-field">
            <input id="lg-pass" v-model="login.pass" :type="login.show ? 'text' : 'password'" placeholder=" " :autocomplete="login.mode === 'login' ? 'current-password' : 'new-password'" />
            <label for="lg-pass">{{ t('password') }}</label>
            <button type="button" class="lg-eye" @click="login.show = !login.show" :aria-label="login.show ? t('hidePass') : t('showPass')">
              <svg v-if="!login.show" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg v-else class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.1 6.1C3.6 7.8 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.1-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>

          <Transition name="fold"><p v-if="login.error" class="lg-error" role="alert">{{ login.error }}</p></Transition>

          <button type="submit" class="lg-submit" :class="{ loading: login.loading, done: login.done }" :disabled="login.loading || login.done">
            <span class="lg-label">{{ login.mode === 'login' ? t('signIn') : t('signUp') }}</span>
            <span class="lg-spin" aria-hidden="true"></span>
            <svg class="lg-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
          </button>

          <button type="button" class="lg-skip" @click="leaveLogin">{{ t('skipLogin') }}</button>
        </form>
      </div>
    </section>

    <!-- ================= APP ================= -->
    <template v-else>
      <header class="topbar" :class="{ scrolled }">
        <div class="topbar-inner">
          <div class="logo" role="button" tabindex="0" @click="showSplash = true" @keydown.enter="showSplash = true" :aria-label="t('backHome')">
            <span class="kj"><b>K</b><i>Journal</i></span>
          </div>
          <nav class="tabs" :aria-label="t('sections')">
            <div class="tabs-inner">
              <div class="tabs-list" ref="tabsRef">
                <button v-for="tab in tabs" :key="tab.id" class="tab" :data-tab="tab.id" :aria-current="activeTab === tab.id ? 'page' : null" @click="activeTab = tab.id">{{ t(tab.label) }}</button>
              </div>
              <div class="tabs-active" aria-hidden="true" :style="{ clipPath: tabClip }">
                <div class="tabs-list"><span v-for="tab in tabs" :key="tab.id" class="tab">{{ t(tab.label) }}</span></div>
              </div>
            </div>
          </nav>
          <div class="spacer"></div>
          <button class="wrapped-btn" @click="openWrapped"><span class="disc"></span>Wrapped 2026</button>
          <button class="lang-btn" @click="toggleLang" :aria-label="t('changeLang')">{{ lang === 'es' ? 'ES' : 'EN' }}</button>
        </div>
      </header>

      <nav class="bnav" :aria-label="t('sections')">
        <button v-for="tab in tabs" :key="tab.id" :class="{ on: activeTab === tab.id }" @click="goTab(tab.id)" :aria-current="activeTab === tab.id ? 'page' : null">
          <span class="bn-ic">
            <svg v-if="tab.id === 'discover'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
            <svg v-else-if="tab.id === 'journal'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
            <svg v-else class="icon" viewBox="0 0 24 24" :fill="activeTab === tab.id ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
          </span>
          <span class="bn-l">{{ t(tab.label) }}</span>
        </button>
        <button @click="openWrapped">
          <span class="bn-ic"><span class="disc"></span></span>
          <span class="bn-l">Wrapped</span>
        </button>
      </nav>

      <main>
        <!-- Buscador -->
        <form class="search" role="search" @submit.prevent="searchCascadeToAdd">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="q">{{ t('searchLabel') }}</label>
          <input id="q" type="search" v-model="searchQuery" :placeholder="t('searchPh')" autocomplete="off" />
          <button v-if="searchResults.length || searchError" type="button" class="icon-btn" @click="clearSearch" :aria-label="t('clear')">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <button type="submit" class="btn btn-primary" :disabled="isSearching">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m19 19-3-3"/></svg>
            <span>{{ isSearching ? t('searching') : t('search') }}</span>
          </button>
        </form>

        <Transition name="tray">
          <div v-if="searchResults.length || searchError" class="results">
            <div class="results-head">
              <h2>{{ searchError || t('results') }}</h2>
              <span v-if="searchResults.length">{{ t('tapToAdd') }}</span>
            </div>
            <div class="row">
              <div v-for="(res, i) in searchResults" :key="res.id" class="tile" :style="{ '--i': i }">
                <div class="tile-poster" v-tilt @click="openShow(res)">
                  <img :src="res.image" :alt="getTitle(res)" loading="lazy" />
                  <button class="bookmark" :class="bookmarkClass(res)" @click.stop="toggleWish(res, $event)" :aria-label="t('wishToggle')">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path :d="findInList(res) ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14'"/></svg>
                  </button>
                </div>
                <div class="tile-title">{{ getTitle(res) }}</div>
                <div class="tile-meta">{{ [res.year, res.platform].filter(Boolean).join(', ') }}</div>
              </div>
            </div>
          </div>
        </Transition>

        <Transition name="view" mode="out-in">

        <!-- ================= DESCUBRIR ================= -->
        <section v-if="activeTab === 'discover'" key="discover">
          <template v-if="discover.loading && !discover.all.length">
            <div class="skel skel-feat"></div>
            <div class="row" style="margin-top:2rem"><div v-for="n in 7" :key="n" class="skel"></div></div>
          </template>

          <div v-else-if="discover.error && !discover.all.length" class="notice">
            <p>{{ discover.error }}</p>
            <button class="btn btn-primary btn-sm" @click="loadDiscover(true)">{{ t('retry') }}</button>
          </div>

          <template v-else>
            <section v-if="featuredList.length && featCur" class="hc" :class="{ paused: hc.paused }">
              <div class="hc-ambient" aria-hidden="true">
                <Transition name="amb"><img :key="featCur.id" :src="featCur.image" alt="" /></Transition>
              </div>
              <div class="hc-track" ref="hcTrack" @scroll.passive="onHcScroll" @touchstart.passive="hcPause" @pointerdown="hcPause" @wheel.passive="hcPause">
                <article v-for="(f, i) in featuredList" :key="f.id" class="hc-card" :class="{ on: i === featIndex }"
                  :style="{ '--d': hc.dist[i] ?? 1, '--s': hc.sign[i] ?? 0 }" @click="i === featIndex ? openShow(f) : hcGo(i)">
                  <img :src="f.image" :alt="getTitle(f)" draggable="false" />
                  <span class="hc-badge">{{ isFresh(f) ? t('justPremiered') : t('onAir') }}</span>
                  <div class="hc-info">
                    <h3>{{ getTitle(f) }}</h3>
                    <p class="hc-meta"><span class="match">{{ matchPct(f) }}% {{ t('forYou') }}</span><span>{{ f.genres.slice(0, 2).map(gl).join(', ') || f.platform }}</span></p>
                    <div class="hc-actions">
                      <button class="hc-add" :class="{ on: findInList(f) }" @click.stop="toggleWish(f, $event)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path :d="findInList(f) ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14'"/></svg><span>{{ findInList(f) ? t('inMyList') : t('myListBtn') }}</span></button>

                          <circle cx="40" cy="40" r="34" class="ring-bg"/>

                      <div class="time-card">

                    <div class="rating-box">

                            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                    <Transition name="fold">
                      <div v-if="selectedSeries.mega" class="mega-banner">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>

                      </div>
                    </Transition>

                    <div class="field">
                      <span class="lbl">{{ t('feltLabel') }}</span>

                        </button>
                      </div>
                    </div>

                    <div class="field">
                      <label for="fq">{{ t('favQuote') }}</label>

                      </div>
                    </div>

                    <div class="field">
                      <label for="ost">{{ t('ostLabel') }}</label>
                      <textarea id="ost" v-model="selectedSeries.ost" class="input" rows="3" style="min-height: 90px" :placeholder="t('ostPh')"></textarea>
                    </div>

                    <div class="cols">
                      <div class="field">
                        <label for="fa">{{ t('favActor') }}</label>
                        <div class="actor-field">
                          <img v-if="favActorPhoto" :key="favActorPhoto" :src="favActorPhoto" alt="" />
                          <div v-else class="actor-ph">{{ (selectedSeries.favoriteActor || '?').slice(0, 1) }}</div>
                          <input id="fa" type="text" v-model="selectedSeries.favoriteActor" class="input" :placeholder="t('favActorPh')" />
                        </div>
                      </div>
                      <div class="field">
                        <label for="rank">{{ t('topPlace') }}</label>
                        <select id="rank" v-model.number="selectedSeries.topRank" class="input">

                      </div>
                    </div>

                    <div v-if="selectedSeries.status === 'viendo'" class="more" :class="{ open: moreOpen }">

                      </button>
                      <div class="more-body"><div><div class="more-inner">
                        <div class="ep-row">
                          <label for="ep">{{ t('leftAt') }}</label>
                          <input id="ep" type="number" min="0" :max="selectedSeries.totalEps || 999" v-model.number="selectedSeries.ep" class="input" />

                          <input type="number" min="1" v-model.number="selectedSeries.totalEps" class="input" :aria-label="t('totalEps')" />

                        <label class="switch">
                          <span>{{ t('pausedLabel') }}<small>{{ t('pausedHint') }}</small></span>
                          <input type="checkbox" v-model="selectedSeries.paused" />
                          <span class="track"></span>
                        </label>
                      </div></div></div>
                    </div>

                    <div class="field">
                      <label for="jn">{{ t('notes') }}</label>
                      <textarea id="jn" v-model="selectedSeries.journalNotes" class="input paper" :placeholder="t('notesPh')"></textarea>

                    <div class="field">
                      <span class="lbl">{{ t('photos') }}</span>

                        <div v-for="(ph, pi) in apiPhotos" :key="'a' + pi" class="pola" :style="{ '--rot': ROTS[pi % ROTS.length], '--i': pi }">

                          <span class="pola-cap">{{ getTitle(selectedSeries) }}</span>
                        </div>
                        <div v-for="(ph, pi) in (selectedSeries.photos || [])" :key="'u' + pi" class="pola" :style="{ '--rot': ROTS[(pi + apiPhotos.length) % ROTS.length], '--i': pi + apiPhotos.length }">
                          <img :src="ph.src" alt="" @click="lightbox = { src: ph.src, caption: ph.caption }" />

                          </button>
                        </div>
                        <label class="pola add" :style="{ '--rot': '0deg', '--i': apiPhotos.length + (selectedSeries.photos || []).length }">

                      </div>
                    </div>
                  </div>

                <button type="button" class="btn btn-primary btn-block" @click="saveProfileJournal">

              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>

              <img :src="pano.bgs[it.id] || it.image" alt="" />
            </div>
            <div class="yr-shade"></div>
            <div class="yr-body" :key="'b' + yr.i">
              <p class="yr-kick">{{ t('panoKicker') }}: {{ t('panoTitle').toLowerCase() }}</p>
              <span class="yr-rank"><b>{{ yr.i + 1 }}</b>{{ t('ofYourYear') }}</span>
              <h2>{{ getTitle(yrCur) }}</h2>
              <div class="bb-meta">
                <span class="match">{{ yrCur.mega ? '10+' : (yrCur.rating || '–') }}/10</span>

          let best = 0, bestD = Infinity;

            const cm = c.offsetLeft + c.offsetWidth / 2;

        async function loadDiscover(force = false) {

          }
          discover.loading = true;

          const days = [...Array(10)].map((_, k) => new Date(Date.now() - k * 864e5).toISOString().slice(0, 10));
          const urls = [
            ...days.map(d => ({ url: `https://api.tvmaze.com/schedule?country=KR&date=${d}`, web: false })),

          ];

          const shows = new Map();
          settled.forEach(res => {
            if (res.status !== "fulfilled") return;

          discover.loading = false;

            E({ type: "tape", x: 1170, y: 110, w: 120, h: 34, rot: 8, color: "#a9d1ff" }),

        /* Cada diseño de dos hojas se separa en dos páginas independientes */
        function splitSpread(c) {
          const halfW = c.w / 2;
          const bgs = SPLIT_BG[c.bg] || ["lined-pink", "gingham"];
          const group = c.group || uid();
          const mk = (k, els) => ({ ...c, id: uid(), w: halfW, spread: false, bg: bgs[k], group, part: k + 1, parts: 2, els });
          const L = [], R = [];
          c.els.forEach(e => (e.x + e.w / 2 < halfW ? L.push(e) : R.push({ ...e, x: e.x - halfW })));
          return [mk(0, L), mk(1, R)];
        }
        function buildCollage(tpl, item, extra) {
          const raw = buildRaw(tpl, item, extra);
          return raw.spread ? splitSpread(raw) : [raw];
        }

        collages.value = storedCollages.flatMap(c => c.spread ? splitSpread(c) : [c]);

        const creator = reactive({ open: false, step: 1, item: null, loading: false, previews: [], extra: null });
        function openCreator(item) {
          creator.open = true;
          creator.step = 1;
          creator.previews = [];
          if (item) chooseDrama(item);
        }
        async function chooseDrama(item) {
          creator.item = item;
          creator.step = 2;
          creator.loading = true;
          const extra = await fetchShowExtras(item);
          creator.extra = extra;
          creator.previews = TEMPLATES.map(tp => ({ tpl: tp, pages: buildCollage(tp, item, extra) }));
          creator.loading = false;
        }

        const editor = reactive({ open: false, c: null, sel: null, scale: 0.5, picker: null, replace: false, intro: false, fresh: null, extra: null, busy: false, busyText: "" });
        const stageRef = ref(null);
        const exporting = ref(false);
        let stageObs = null;
        const selEl = computed(() => editor.c?.els.find(e => e.id === editor.sel) || null);
        const editorItem = computed(() => myJournalList.value.find(i => i.id === editor.c?.itemId));
        const photoPool = computed(() => {
          const it = editorItem.value;
          const list = [];
          if (it) list.push(it.image, ...(it.photos || []).map(p => p.src));
          if (editor.extra) list.push(...editor.extra.photos, ...editor.extra.cast.map(c => c.photo));
          list.push(...myJournalList.value.map(i => i.image));
          return [...new Set(list.filter(Boolean))];
        });

        function fitStage() {
          const el = stageRef.value;
          if (!el || !editor.c) return;
          const r = el.getBoundingClientRect();
          editor.scale = Math.max(0.1, Math.min((r.width - 40) / editor.c.w, (r.height - 40) / editor.c.h));
        }
        function openEditor(c, intro = false) {
          editor.c = c;
          editor.sel = null;
          editor.picker = null;
          editor.intro = intro;
          editor.open = true;
          editor.extra = null;
          if (intro) setTimeout(() => (editor.intro = false), 2200);
          const it = myJournalList.value.find(i => i.id === c.itemId);
          if (it) fetchShowExtras(it).then(x => { if (editor.c === c) editor.extra = x; });
          nextTick(() => {
            fitStage();
            stageObs?.disconnect();
            if (stageRef.value && "ResizeObserver" in window) {
              stageObs = new ResizeObserver(fitStage);
              stageObs.observe(stageRef.value);
            }
          });
        }
        function createCollage(pv) {
          const pages = JSON.parse(JSON.stringify(pv.pages));
          const start = collages.value.length;
          collages.value.push(...pages);
          saveCollages();
          creator.open = false;
          openEditor(collages.value[start], true);
        }
        const groupPages = computed(() => editor.c?.group ? collages.value.filter(g => g.group === editor.c.group) : []);
        function movePage(i, dir) {
          const arr = collages.value;
          const j = i + dir;
          if (j < 0 || j >= arr.length) return;
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        /* Recortar silueta */
        async function cutoutPhoto() {
          const el = selEl.value;
          if (!el || editor.busy) return;
          editor.busy = true;
          editor.busyText = t("cutLoading");
          try {
            const input = await srcToBlob(el.origSrc || el.src);
            const mod = await import(BG_REMOVAL_URL);
            const remove = mod.default || mod.removeBackground;
            editor.busyText = t("cutWorking");
            const blob = await remove(input, {
              output: { format: "image/png" },
              progress: (key, cur, total) => {
                if (key.includes("fetch") && total) editor.busyText = `${t("cutLoading")} ${Math.round(cur / total * 100)}%`;
                else editor.busyText = t("cutWorking");
              }
            });
            const out = await outlineImage(await blobToDataURL(blob), 12);
            el.origSrc = el.origSrc || el.src;
            el.src = out.url;
            el.frame = "sil";
            el.h = Math.round(el.w * out.h / out.w);
            showToast(t("cutDone"));
          } catch (err) {
            console.warn(err);
            showToast(t("cutFail"));
          } finally {
            editor.busy = false;
          }
        }
        async function addOutline() {
          const el = selEl.value;
          if (!el) return;
          editor.busy = true;
          editor.busyText = t("cutWorking");
          try {
            const out = await outlineImage(el.src, 8);
            el.src = out.url;
            el.h = Math.round(el.w * out.h / out.w);
          } catch (_) { showToast(t("cutFail")); }
          editor.busy = false;
        }
        function restorePhoto() {
          const el = selEl.value;
          if (!el?.origSrc) return;
          el.src = el.origSrc;
          delete el.origSrc;
          el.frame = "organic";
        }

        /* Cuaderno */
        const book = reactive({ open: false, flipped: 0, page: 0, dir: 1, turning: -1, mobile: false, pw: 400, ph: 570 });
        const bookSheets = computed(() => {
          const out = [];
          for (let i = 0; i < collages.value.length; i += 2) out.push({ front: collages.value[i], back: collages.value[i + 1] || null });
          return out;
        });
        function sizeBook() {
          book.mobile = window.innerWidth < 760;
          const availH = window.innerHeight - 170;
          if (book.mobile) {
            book.pw = Math.min(window.innerWidth - 32, availH * 0.7);
          } else {
            book.pw = Math.min((window.innerWidth - 120) / 2, availH * 0.7);
          }
          book.ph = Math.round(book.pw / 0.7);
          book.ringH = Math.round(book.ph * 0.92);
          book.pw = Math.round(book.pw);
        }
        const ringH = computed(() => book.ringH || 500);
        const ringPath = (k, dy) => {
          const y = (k - 0.5) * ringH.value / 12 + dy;
          return `M20.5 ${y + 3} C12 ${y - 17} 48 ${y - 17} 39.5 ${y + 3}`;
        };
        const fitScale = c => Math.min((book.pw - 24) / c.w, (book.ph - 24) / c.h);
        function openBook() {
          sizeBook();
          book.flipped = 0;
          book.page = 0;
          book.turning = -1;
          book.open = true;
        }
        const canBookNext = computed(() => book.mobile ? book.page < collages.value.length - 1 : book.flipped < bookSheets.value.length);
        const canBookPrev = computed(() => book.mobile ? book.page > 0 : book.flipped > 0);
        const bookLabel = computed(() => {
          const n = collages.value.length;
          if (book.mobile) return `${book.page + 1} / ${n}`;
          const right = book.flipped * 2 + 1;
          const left = right - 1;
          return [left, right].filter(x => x >= 1 && x <= n).join("-") + " / " + n || t("cover");
        });
        let turnTimer;
        function turnSheet(i) {
          book.turning = i;
          clearTimeout(turnTimer);
          turnTimer = setTimeout(() => (book.turning = -1), 1000);
        }
        function bookNext() {
          if (!canBookNext.value) return;
          if (book.mobile) { book.dir = 1; book.page++; return; }
          turnSheet(book.flipped);
          book.flipped++;
        }
        function bookPrev() {
          if (!canBookPrev.value) return;
          if (book.mobile) { book.dir = -1; book.page--; return; }
          book.flipped--;
          turnSheet(book.flipped);
        }
        function bookTap(e) {
          const r = e.currentTarget.getBoundingClientRect();
          (e.clientX - r.left < r.width / 3) ? bookPrev() : bookNext();
        }
        let swipeX = null;
        const bookSwipeStart = e => { swipeX = e.clientX; };
        function bookSwipeEnd(e) {
          if (swipeX === null) return;
          const dx = e.clientX - swipeX;
          swipeX = null;
          if (Math.abs(dx) > 50) { dx < 0 ? bookNext() : bookPrev(); e.stopPropagation(); }
        }
        function closeEditor() {
          if (editor.c) editor.c.updated = today();
          saveCollages();
          editor.open = false;
          editor.sel = null;
          stageObs?.disconnect();
        }
        function deleteCollage(c) {
          if (!window.confirm(t("confirmDelete"))) return;
          collages.value = collages.value.filter(x => x !== c);
          saveCollages();
        }
        watch(collages, () => {
          clearTimeout(collageTimer);
          collageTimer = setTimeout(saveCollages, 600);
        }, { deep: true });

        /* Arrastrar, cambiar tamaño y girar */
        let drag = null;
        function onElDown(e, el, mode) {
          e.preventDefault();
          editor.sel = el.id;
          editor.picker = null;
          const node = e.currentTarget.closest ? e.currentTarget.closest(".cel") : null;
          const r = node ? node.getBoundingClientRect() : { left: e.clientX, top: e.clientY, width: 0, height: 0 };
          drag = { mode, el, px: e.clientX, py: e.clientY, x: el.x, y: el.y, w: el.w, h: el.h, rot: el.rot || 0, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
          window.addEventListener("pointermove", onDrag);
          window.addEventListener("pointerup", endDrag, { once: true });
        }
        function onDrag(e) {
          if (!drag) return;
          const s = editor.scale;
          const dx = (e.clientX - drag.px) / s, dy = (e.clientY - drag.py) / s;
          const el = drag.el;
          if (drag.mode === "move") {
            el.x = Math.round(drag.x + dx);
            el.y = Math.round(drag.y + dy);
          } else if (drag.mode === "resize") {
            const a = drag.rot * Math.PI / 180;
            const lx = dx * Math.cos(a) + dy * Math.sin(a);
            const ly = -dx * Math.sin(a) + dy * Math.cos(a);
            if (el.type === "photo" || el.type === "sticker") {
              const k = Math.max(0.15, (drag.w + lx) / drag.w);
              el.w = Math.round(drag.w * k);
              el.h = Math.round(drag.h * k);
            } else {
              el.w = Math.max(40, Math.round(drag.w + lx));
              el.h = Math.max(24, Math.round(drag.h + ly));
            }
          } else {
            let ang = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) * 180 / Math.PI + 90;
            if (ang > 180) ang -= 360;
            if (Math.abs(ang) < 4) ang = 0;
            el.rot = Math.round(ang);
          }
        }
        function endDrag() {
          window.removeEventListener("pointermove", onDrag);
          drag = null;
        }

        /* Agregar elementos */
        const topZ = () => Math.max(0, ...editor.c.els.map(e => e.z || 0)) + 1;
        function pushEl(o) {
          const el = { id: uid(), rot: 0, z: topZ(), x: Math.round(editor.c.w / 2 - o.w / 2), y: Math.round(editor.c.h / 2 - o.h / 2), ...o };
          editor.c.els.push(el);
          editor.sel = el.id;
          editor.fresh = el.id;
          setTimeout(() => { if (editor.fresh === el.id) editor.fresh = null; }, 700);
          return el;
        }
        function addText(kind) {
          const it = editorItem.value;
          const title = it ? getTitle(it) : "K-Journal";
          const presets = {
            text: { font: "hand", size: 30, w: 380, h: 150, text: t("newText"), color: "#1d1622" },
            title: { font: "script", size: 80, w: 620, h: 150, text: title, color: "#ff5c9d", outline: true },
            ransom: { font: "ransom", size: 70, w: 560, h: 200, text: title },
            tag: { font: "marker", size: 36, w: 280, h: 70, text: actorName(it?.favoriteActor) || "Nombre", bgStyle: "tag", fill: "#ffe066", align: "center", color: "#1d1622" },
            note: { font: "hand", size: 24, w: 320, h: 220, text: t("newText"), bgStyle: "paper", color: "#1d1622" },
            stamp: { font: "sans", size: 30, w: 190, h: 190, text: t("madeIn"), bgStyle: "stamp", color: "#d6334f", align: "center", rot: -12 }
          };
          pushEl({ type: "text", align: "left", ...presets[kind] });
        }
        function addSticker(st) {
          pushEl({ type: "sticker", sticker: st.id, color: st.color, w: 110, h: 110, rot: Math.round(Math.random() * 30 - 15) });
          editor.picker = null;
        }
        function addTape() { pushEl({ type: "tape", w: 180, h: 46, color: ["#ff8fbe", "#a9d1ff", "#ffe066", "#c7b6ff"][Math.floor(Math.random() * 4)], rot: -8 }); }
        function addStars() {
          const it = editorItem.value;
          pushEl({ type: "stars", value: it?.rating || 10, mega: !!it?.mega, color: "#f5b400", w: 320, h: 60 });
        }
        function openPicker(kind, replace = false) {
          editor.picker = editor.picker === kind && !replace ? null : kind;
          editor.replace = replace;
        }
        function pickPhoto(src) {
          if (editor.replace && selEl.value?.type === "photo") {
            selEl.value.src = src;
          } else {
            const img = new Image();
            const el = pushEl({ type: "photo", src, frame: "cutout", w: 320, h: 400, rot: Math.round(Math.random() * 10 - 5) });
            img.onload = () => { if (img.naturalWidth) el.h = Math.round(el.w * img.naturalHeight / img.naturalWidth); };
            img.src = src;
          }
          editor.picker = null;
          editor.replace = false;
        }
        async function uploadToCollage(e) {
          const files = [...e.target.files].filter(f => f.type.startsWith("image/")).slice(0, 6);
          for (const f of files) {
            try { pickPhoto(await compressImage(f, 1000)); } catch (_) {}
          }
          e.target.value = "";
        }
        function layer(dir) {
          const el = selEl.value;
          if (!el) return;
          el.z = dir > 0 ? topZ() : Math.min(...editor.c.els.map(x => x.z || 0)) - 1;
        }
        function duplicateEl() {
          const el = selEl.value;
          if (!el) return;
          const copy = { ...JSON.parse(JSON.stringify(el)), id: uid(), x: el.x + 30, y: el.y + 30, z: topZ() };
          editor.c.els.push(copy);
          editor.sel = copy.id;
          editor.fresh = copy.id;
        }
        function removeEl() {
          if (!editor.sel) return;
          editor.c.els = editor.c.els.filter(x => x.id !== editor.sel);
          editor.sel = null;
        }

        async function exportPNG() {
          if (exporting.value) return;
          exporting.value = true;
          await nextTick();
          try {
            await document.fonts?.ready;
            await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
            const node = document.querySelector(".export-host .cp");
            const canvas = await window.html2canvas(node, { useCORS: true, backgroundColor: null, scale: 1, logging: false });
            const a = document.createElement("a");
            a.download = (editor.c.name || "collage").replace(/[^\w\- ]+/g, "") + ".png";
            a.href = canvas.toDataURL("image/png");
            a.click();
            showToast(t("exported"));
          } catch (_) {
            showToast(t("exportFail"));
          } finally {
            exporting.value = false;
          }
        }

        /* =========================================================
           INICIO DE SESIÓN
           ========================================================= */
        const userName = ref("");
        try { userName.value = JSON.parse(localStorage.getItem("entre_escenas_user") || "null")?.name || ""; } catch (_) {}
        const login = reactive({ mode: "login", name: "", email: "", pass: "", show: false, loading: false, done: false, error: "", leaving: false, word: 0, rx: 0, ry: 0 });
        const loginWords = computed(() => STRINGS[lang.value].loginWords);
        const helixImgs = computed(() => {
          let pool = [...myJournalList.value.map(i => i.image), ...popular.list.map(i => i.image), ...discover.all.map(i => i.image)];
          try {
            const cached = JSON.parse(localStorage.getItem("entre_escenas_discover_v1") || "null");
            if (cached?.all) pool.push(...cached.all.map(i => i.image));
          } catch (_) {}
          pool = [...new Set(pool.filter(Boolean))];
          if (!pool.length) return [];
          const n = window.innerWidth < 700 ? 26 : 36;
          return Array.from({ length: n }, (_, i) => pool[i % pool.length]);
        });
        function loginTilt(e) {
          if (!canHover || reduceMotion) return;
          login.ry = (e.clientX / window.innerWidth - 0.5) * 18;
          login.rx = (0.5 - e.clientY / window.innerHeight) * 8;
        }
        let wordTimer;
        function startWords() {
          clearInterval(wordTimer);
          if (reduceMotion) return;
          wordTimer = setInterval(() => { login.word = (login.word + 1) % loginWords.value.length; }, 2600);
        }
        watch(showSplash, v => { v ? startWords() : clearInterval(wordTimer); }, { immediate: true });
        function submitLogin() {
          login.error = "";
          if (login.mode === "register" && !login.name) { login.error = t("errName"); return; }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(login.email)) { login.error = t("errEmail"); return; }
          if ((login.pass || "").length < 6) { login.error = t("errPass"); return; }
          login.loading = true;
          setTimeout(() => {
            login.loading = false;
            login.done = true;
            try {
              const prev = JSON.parse(localStorage.getItem("entre_escenas_user") || "null");
              userName.value = login.name || prev?.name || login.email.split("@")[0];
              localStorage.setItem("entre_escenas_user", JSON.stringify({ name: userName.value, email: login.email }));
            } catch (_) {}
            setTimeout(leaveLogin, 550);
          }, 900);
        }
        function leaveLogin() {
          login.leaving = true;
          setTimeout(() => {
            enter("journal");
            login.leaving = false;
            login.done = false;
            login.pass = "";
          }, reduceMotion ? 50 : 850);
        }

        function toggleLang() { lang.value = lang.value === "es" ? "en" : "es"; }

        watch([selectedSeries, wrappedOpen, () => editor.open, () => creator.open, () => book.open], ([a, b, c, d, e]) => document.body.classList.toggle("locked", !!a || b || c || d || e));
        window.addEventListener("resize", () => { if (book.open) sizeBook(); });
        const onKey = e => {
          const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
          if (editor.open && editor.sel && !typing && (e.key === "Delete" || e.key === "Backspace")) { e.preventDefault(); removeEl(); return; }
          if (book.open) {
            if (e.key === "ArrowRight") bookNext();
            else if (e.key === "ArrowLeft") bookPrev();
            else if (e.key === "Escape") book.open = false;
            return;
          }
          if (e.key !== "Escape") return;
          if (editor.open) {
            if (editor.picker) editor.picker = null;
            else if (editor.sel) editor.sel = null;
            else closeEditor();
            return;
          }
          if (creator.open) { creator.open = false; return; }
          if (lightbox.value) lightbox.value = null;
          else if (selectedSeries.value) closeProfile();
          else if (wrappedOpen.value) closeWrapped();
        };
        const onScroll = () => { scrolled.value = window.scrollY > 8; };

        onMounted(() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed.myJournalList?.length) myJournalList.value = parsed.myJournalList;
              if (parsed.favoriteActorsList?.length) favoriteActorsList.value = parsed.favoriteActorsList;
            }
          } catch (_) {}
          hydrateRealPosters();
          window.addEventListener("keydown", onKey);
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", updateTabClip);
          document.fonts?.ready.then(updateTabClip);
        });
        onBeforeUnmount(() => {
          clearInterval(wordTimer);
          window.removeEventListener("keydown", onKey);
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", updateTabClip);
          wrObserver?.disconnect();
        });

        return {
          userName, thrownId, featCur, deckOrder, deckStyle, HANG_ROT: ["-4deg", "3deg", "-2deg", "5deg", "-3deg", "2deg"],
          login, loginWords, helixImgs, loginTilt, submitLogin, leaveLogin,
          groupPages, movePage, cutoutPhoto, addOutline, restorePhoto,
          book, bookSheets, fitScale, ringH, ringPath, openBook, canBookNext, canBookPrev, bookLabel, bookNext, bookPrev, bookTap, bookSwipeStart, bookSwipeEnd,
          collages, creator, editor, stageRef, exporting, selEl, photoPool, openCreator, chooseDrama, createCollage, openEditor, closeEditor, deleteCollage,
          onElDown, addText, addSticker, addTape, addStars, openPicker, pickPhoto, uploadToCollage, layer, duplicateEl, removeEl, exportPNG,
          STICKERS, FONTS, FRAMES, SWATCHES, BG_PAGES,
          ROTS, watchingList, apiPhotos, lightbox, moreOpen, epNote, addPhotos, setMega,
          featuredList, featIndex, featCycle, featHover, nextFeat, popular, peru, actorRows,
          STAR, MOODS, words, ringOn, ringOffset, durationLabel, toggleMood, favActorPhoto, onWrScroll, t, gl, tabs, tabsRef, tabClip, scrolled,
          showSplash, lang, activeTab, typeFilter, statusFilter,
          searchQuery, isSearching, searchResults, searchError,
          selectedSeries, isAddingNewFromApi, selectedSeriesCast,
          myJournalList, favoriteActorsList, watchedItems, displayedItems, wishList,
          top10List, top3List, nowWatching, countType, countStatus,
          hover, toast, canHover,
          getTitle, actorName, statusLabel, formatDate, monthName, starClass, setRating, enter,
          findInList, bookmarkClass, wishLabel, toggleWish, cyclePriority, canMove, moveWish, startWatching, removeItem,
          discover, isFresh, freshList, airingList, featured, discoverGenres, loadDiscover,
          searchCascadeToAdd, clearSearch, openShow, openProfileAndJournal, closeProfile, setStatus,
          isPicked, pickActor, saveProfileJournal, toggleLang,
          hcTrack, hc, onHcScroll, hcGo, hcAuto, hcPause, goTab,
          backdrops, needBackdrop, matchPct, yr, yrItems, yrCur, yrNext, moodName,
          PANO_SL, pano, panoStage, panoVisible, panoIndex, panoUniqueIndex, panoDown, wrLoad,
          wrappedOpen, wrRef, wrIndex, wrLight, wrCount, countUp, wr, topCountdown, marqueeImgs, floatStyle,
          observeWrapped, openWrapped, closeWrapped, goSlide
        };
      }
    }).component("collage-page", CollagePage).directive("tilt", tiltDirective).directive("reveal", revealDirective).mount("#app");
  </script>
</body>
</html>
