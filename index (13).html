<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>K-Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=Caveat:wght@500;700&family=Pacifico&family=Patrick+Hand&family=DM+Serif+Display&family=Courier+Prime:wght@400;700&family=Gloock&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --rose: #ea287b;
      --rose-press: #cf1a69;
      --rose-tint: #fdecf3;
      --rose-soft: #f59bc1;
      --ink: #1d1622;
      --ink-2: #5f5566;
      --ink-3: #9a8fa1;
      --paper: #faf7f9;
      --surface: #ffffff;
      --line: #eee4ea;
      --field: #f5eff3;
      --star-off: #e6dbe3;
      --night: #120d16;

      --r-lg: 24px;
      --r-md: 16px;
      --r-sm: 12px;
      --shadow-1: 0 1px 2px rgba(29, 22, 34, .04), 0 8px 24px rgba(29, 22, 34, .06);
      --shadow-pop: 0 30px 80px rgba(29, 22, 34, .28);

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { overflow: hidden; }
    img { display: block; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:disabled { cursor: default; opacity: .35; }
    :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 8px; }
    .icon { width: 1em; height: 1em; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Marca ---------- */
    .logo { display: inline-block; font-weight: 800; line-height: .9; letter-spacing: -0.045em; font-size: 1.3rem; }
    .logo-bar { display: block; height: 5px; width: 68%; margin-top: 5px; border-radius: 99px; background: var(--rose); transform-origin: left; }

    /* ---------- Botones ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      border-radius: 999px; padding: .85rem 1.4rem;
      font-weight: 700; font-size: .92rem;
      transition: transform 140ms var(--ease-out), background-color 160ms ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--rose); color: #fff; }
    .btn-quiet { background: var(--field); }
    .btn-glass { background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(10px); }
    .btn-white { background: #fff; color: var(--ink); }
    .btn-block { width: 100%; }
    .btn-sm { padding: .6rem 1rem; font-size: .84rem; }
    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover { background: var(--rose-press); }
      .btn-quiet:hover { background: #ece3ea; }
      .btn-glass:hover { background: rgba(255,255,255,.26); }
    }

    /* =========================================================
       SPLASH
       ========================================================= */
    .splash { min-height: 100dvh; display: grid; place-items: center; padding: 2rem 1.25rem; }
    .splash-inner { width: 100%; max-width: 400px; }
    .fan { position: relative; height: min(280px, 56vw + 40px); margin-bottom: 2.25rem; }
    .fan img {
      position: absolute; top: 0; left: 50%;
      width: min(150px, 28vw); aspect-ratio: 2/3; object-fit: cover;
      border-radius: 18px; box-shadow: 0 18px 40px rgba(29, 22, 34, .18); background: var(--line);
      transform: translateX(var(--x)) translateY(var(--y)) rotate(var(--rot));
      animation: fan-in 900ms var(--ease-out) both; animation-delay: calc(var(--i) * 70ms);
    }
    .fan img:nth-child(1) { --rot: -14deg; --x: -150%; --y: 26px; }
    .fan img:nth-child(2) { --rot: -5deg;  --x: -88%;  --y: 6px; }
    .fan img:nth-child(3) { --rot: 5deg;   --x: -12%;  --y: 6px; }
    .fan img:nth-child(4) { --rot: 14deg;  --x: 50%;   --y: 26px; }
    @keyframes fan-in { from { opacity: 0; transform: translateX(-50%) translateY(60px) rotate(0deg) scale(.92); } }
    .splash .logo { font-size: 2.6rem; margin-bottom: 1.25rem; }
    .splash .logo-bar { animation: draw 700ms var(--ease-out) 450ms both; }
    @keyframes draw { from { transform: scaleX(0); } }
    .splash h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: .5rem; }
    .splash p { color: var(--ink-2); line-height: 1.55; margin-bottom: 1.75rem; }
    .rise { animation: rise 600ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .splash-actions { display: grid; gap: .6rem; }

    /* =========================================================
       INICIO DE SESIÓN
       ========================================================= */
    .login { position: fixed; inset: 0; z-index: 60; background: #0c080f; color: #fff; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
    .hx-scene { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 45%; pointer-events: none; }
    .hx { position: absolute; left: 50%; top: 52%; transform-style: preserve-3d; transform: rotateX(calc(-8deg + var(--rx, 0deg))) rotateY(var(--ry, 0deg)); transition: transform 900ms var(--ease-out), opacity 700ms ease; --r: 470px; }
    .hx-spin { transform-style: preserve-3d; animation: hx-spin 70s linear infinite; }
    @keyframes hx-spin { to { transform: rotateY(-360deg); } }
    .hx-card {
      position: absolute; left: -62px; top: -88px; width: 124px; height: 176px;
      border-radius: 6px; overflow: hidden; background: #241a29;
      transform: rotateY(var(--a)) translateZ(var(--r)) translateY(var(--y));
      box-shadow: 0 20px 40px rgba(0,0,0,.45);
      animation: hx-in 1800ms cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(200ms + var(--i) * 32ms);
    }
    .hx-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes hx-in { from { opacity: 0; transform: rotateY(calc(var(--a) - 140deg)) translateZ(var(--r)) translateY(calc(var(--y) + 900px)) rotateZ(20deg); } }
    .login-vignette { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(ellipse 42% 38% at 50% 50%, rgba(12,8,15,.88), rgba(12,8,15,.55) 55%, rgba(12,8,15,0) 80%),
      linear-gradient(180deg, #0c080f 0%, rgba(12,8,15,0) 18%, rgba(12,8,15,0) 80%, #0c080f 100%); }
    .login-top { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; animation: rise 700ms var(--ease-out) both; }
    .login-top .logo { color: #fff; font-size: 1.25rem; }
    .login-top .lang-btn { color: rgba(255,255,255,.75); }
    .login-top .lang-btn:hover { background: rgba(255,255,255,.1); }
    .login-center { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 1.25rem 2rem; transition: opacity 500ms ease, transform 600ms var(--ease-out); overflow-y: auto; }

    .login-h { display: flex; flex-direction: column; align-items: center; gap: .1em; font-size: clamp(2.6rem, 7.5vw, 5.6rem); font-weight: 800; letter-spacing: -0.05em; line-height: 1; margin-bottom: 1.1rem; }
    .lh-line { animation: rise 900ms var(--ease-out) 700ms both; }
    .vf { position: relative; display: inline-flex; align-items: center; justify-content: center; padding: .12em .35em .2em; min-width: 3em; animation: vf-in 900ms var(--ease-out) 900ms both; }
    @keyframes vf-in { from { opacity: 0; transform: scale(1.15); } }
    .vf-c { position: absolute; width: .32em; height: .32em; border: 3px solid var(--rose); }
    .vf-c.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
    .vf-c.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
    .vf-c.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
    .vf-c.br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
    .rec { position: absolute; right: .3em; top: -.15em; transform: translateY(-100%); display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: rgba(255,255,255,.8); }
    .rec i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c; animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .vf-word { display: inline-flex; perspective: 600px; white-space: nowrap; }
    .wl {
      display: inline-block; color: transparent;
      background: repeating-linear-gradient(180deg, #ff5c9d 0 5px, rgba(255,92,157,.25) 5px 8px);
      -webkit-background-clip: text; background-clip: text;
      animation: scan 1.4s linear infinite;
    }
    @keyframes scan { to { background-position: 0 8px; } }
    .word-enter-active .wl { animation: wl-in 700ms var(--ease-out) both, scan 1.4s linear infinite; animation-delay: calc(var(--k) * 40ms), 0s; }
    @keyframes wl-in { from { opacity: 0; transform: translateY(70%) rotateX(-90deg); filter: blur(6px); } }
    .word-leave-active { transition: opacity 280ms ease, transform 280ms ease, filter 280ms ease; }
    .word-leave-to { opacity: 0; transform: translateY(-25%); filter: blur(6px); }
    .login-sub { text-shadow: 0 2px 12px rgba(12,8,15,.9), 0 0 2px rgba(12,8,15,.8); color: rgba(255,255,255,.78); font-size: clamp(.95rem, 1.6vw, 1.1rem); max-width: 40ch; line-height: 1.5; margin-bottom: 1.75rem; animation: rise 800ms var(--ease-out) 1100ms both; }

    .login-card {
      width: min(400px, 100%); text-align: left;
      background: rgba(24, 16, 28, .62); border: 1px solid rgba(255,255,255,.1); border-radius: 26px;
      backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
      padding: 1.1rem; box-shadow: 0 30px 80px rgba(0,0,0,.45);
      animation: card-in 900ms var(--ease-out) 1250ms both;
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(.97); } }
    .lg-tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.06); border-radius: 999px; padding: 4px; margin-bottom: 1rem; }
    .lg-tabs button { position: relative; z-index: 1; padding: .6rem; border-radius: 999px; font-size: .86rem; font-weight: 700; color: rgba(255,255,255,.6); transition: color 250ms ease; }
    .lg-tabs button.on { color: #fff; }
    .lg-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--rose); box-shadow: 0 6px 18px rgba(234,40,123,.45); transition: transform 380ms var(--ease-out); }
    .lg-pill.right { transform: translateX(100%); }
    .lg-field { position: relative; margin-bottom: .7rem; }
    .lg-field input { width: 100%; height: 56px; padding: 1.35rem 1rem .4rem; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: #fff; font: inherit; font-size: 1rem; outline: none; transition: border-color 200ms ease, background-color 200ms ease, box-shadow 200ms ease; }
    .lg-field input:focus { border-color: rgba(255,92,157,.7); background: rgba(255,255,255,.08); box-shadow: 0 0 0 4px rgba(234,40,123,.18); }
    .lg-field label { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.55); font-size: .95rem; pointer-events: none; transform-origin: left; transition: transform 220ms var(--ease-out), color 220ms ease; }
    .lg-field input:focus + label, .lg-field input:not(:placeholder-shown) + label { transform: translateY(-115%) scale(.78); color: #ff9ec7; }
    .lg-eye { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,.6); }
    .lg-eye:hover { color: #fff; background: rgba(255,255,255,.08); }
    .lg-error { color: #ff9ec7; font-size: .84rem; margin: .1rem .25rem .7rem; }
    .lg-submit { position: relative; width: 100%; height: 54px; border-radius: 999px; background: var(--rose); color: #fff; font-weight: 800; font-size: .98rem; overflow: hidden; margin-top: .3rem; transition: transform 140ms var(--ease-out), background-color 200ms ease, box-shadow 300ms ease; box-shadow: 0 12px 30px rgba(234,40,123,.4); }
    .lg-submit::before { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); transform: translateX(-120%); }
    @media (hover: hover) and (pointer: fine) { .lg-submit:hover::before { transform: translateX(120%); transition: transform 800ms var(--ease-out); } }
    .lg-submit:active { transform: scale(.98); }
    .lg-submit:disabled { opacity: 1; cursor: default; }
    .lg-label, .lg-spin, .lg-check { position: absolute; inset: 0; margin: auto; display: grid; place-items: center; transition: opacity 250ms ease, transform 300ms var(--ease-out); }
    .lg-spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; opacity: 0; transform: scale(.6); animation: spin 700ms linear infinite; }
    .lg-check { width: 26px; height: 26px; opacity: 0; transform: scale(.5); stroke-dasharray: 24; stroke-dashoffset: 24; }
    .lg-submit.loading .lg-label, .lg-submit.done .lg-label { opacity: 0; transform: translateY(-8px); }
    .lg-submit.loading .lg-spin { opacity: 1; transform: none; }
    .lg-submit.done { background: #22b07d; box-shadow: 0 12px 30px rgba(34,176,125,.4); }
    .lg-submit.done .lg-check { opacity: 1; transform: none; stroke-dashoffset: 0; transition: opacity 200ms ease, transform 400ms var(--ease-out), stroke-dashoffset 450ms var(--ease-out) 100ms; }
    .lg-skip { display: block; margin: .9rem auto .2rem; font-size: .84rem; font-weight: 600; color: rgba(255,255,255,.65); padding: .3rem .6rem; border-radius: 8px; }
    .lg-skip:hover { color: #fff; }

    .login.leaving .hx { transform: rotateX(-8deg) rotateY(0deg) scale(2.4); opacity: 0; transition: transform 900ms cubic-bezier(.7, 0, .84, 0), opacity 800ms ease 100ms; }
    .login.leaving .login-center, .login.leaving .login-top { opacity: 0; transform: scale(.96); }
    .login.leaving { transition: background-color 800ms ease; }

    @media (max-width: 700px) {
      .hx { --r: 300px; top: 48%; }
      .hx-card { width: 92px; height: 130px; left: -46px; top: -65px; }
      .login-center { justify-content: center; padding-bottom: 3rem; }
      .login-h { font-size: clamp(2.3rem, 11vw, 3rem); }
      .vf { margin-top: .45em; }
      .rec { font-size: .66rem; top: -.1em; }
    }
    @media (max-height: 700px) and (min-width: 701px) { .login-h { font-size: clamp(2.2rem, 6vw, 4rem); } .login-sub { margin-bottom: 1rem; } }
    @media (prefers-reduced-motion: reduce) {
      .hx-spin, .hx-card, .wl, .word-enter-active .wl, .rec i, .lh-line, .vf, .login-sub, .login-card, .login-top { animation: none !important; }
      .hx { transition: none; }
    }

    /* =========================================================
       LAYOUT
       ========================================================= */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(250, 247, 249, .82);
      backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
      border-bottom: 1px solid transparent; transition: border-color 200ms ease;
    }
    .topbar.scrolled { border-color: var(--line); }
    .topbar-inner { max-width: 1180px; margin: 0 auto; padding: .85rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .topbar .logo { cursor: pointer; }
    .spacer { flex: 1; }
    .lang-btn { font-size: .78rem; font-weight: 700; color: var(--ink-2); padding: .45rem .7rem; border-radius: 999px; transition: background-color 160ms ease; }
    @media (hover: hover) and (pointer: fine) { .lang-btn:hover { background: var(--field); } }
    .wrapped-btn {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .5rem .95rem .5rem .55rem; border-radius: 999px;
      background: var(--ink); color: #fff; font-size: .82rem; font-weight: 700;
      transition: transform 140ms var(--ease-out);
    }
    .wrapped-btn:active { transform: scale(.96); }
    .wrapped-btn .disc {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--rose), #ff9ec7, #7a2bd6, var(--rose));
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    .tabs-inner { position: relative; width: max-content; }
    .tabs-list { display: flex; gap: .15rem; }
    .tab { padding: .55rem 1rem; border-radius: 999px; font-size: .86rem; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
    .tabs-active { position: absolute; inset: 0; pointer-events: none; background: var(--rose); border-radius: 999px; transition: clip-path 300ms var(--ease-out); }
    .tabs-active .tab { color: #fff; }

    main { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 6rem; }
    main > section { margin-top: 1.75rem; }

    /* ---------- Buscador ---------- */
    .search {
      display: flex; align-items: center; gap: .6rem;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: .4rem .4rem .4rem 1.1rem; box-shadow: var(--shadow-1);
      transition: border-color 160ms ease, box-shadow 200ms ease;
    }
    .search:focus-within { border-color: #f1bcd3; box-shadow: 0 0 0 4px var(--rose-tint), var(--shadow-1); }
    .search .icon { color: var(--ink-3); font-size: 1.05rem; }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1rem; color: var(--ink); }
    .search input::placeholder { color: var(--ink-3); }
    .search .btn { padding: .6rem 1.1rem; font-size: .85rem; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);
      transition: background-color 160ms ease, transform 140ms var(--ease-out);
    }
    .icon-btn:active:not(:disabled) { transform: scale(.9); }
    @media (hover: hover) and (pointer: fine) { .icon-btn:hover:not(:disabled) { background: var(--field); } }

    .results { margin-top: 1rem; }
    .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .75rem; }
    .results-head h2 { font-size: .95rem; font-weight: 700; }
    .results-head span { font-size: .8rem; color: var(--ink-3); }
    .tray-enter-active { transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
    .tray-leave-active { transition: opacity 150ms ease, transform 150ms ease; }
    .tray-enter-from, .tray-leave-to { opacity: 0; transform: translateY(-6px); }

    /* ---------- Fila horizontal de pósters ---------- */
    .row {
      display: grid; grid-auto-flow: column; grid-auto-columns: 148px;
      gap: 1rem; overflow-x: auto; padding: 4px 2px .75rem; margin: 0 -2px;
      scroll-snap-type: x mandatory; scrollbar-width: none;
    }
    .row::-webkit-scrollbar { display: none; }
    .tile { text-align: left; scroll-snap-align: start; min-width: 0; animation: rise 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
    .tile-poster { position: relative; border-radius: var(--r-sm); overflow: hidden; aspect-ratio: 2/3; background: var(--line); margin-bottom: .55rem; cursor: pointer; display: block; width: 100%; }
    .tile-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease-out); }
    @media (hover: hover) and (pointer: fine) { .tile-poster:hover img { transform: scale(1.04); } }
    .tile-title { font-size: .86rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tile-meta { font-size: .74rem; color: var(--ink-3); margin-top: .15rem; }
    .bookmark {
      position: absolute; right: 7px; top: 7px; z-index: 2;
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(20, 14, 24, .45); color: #fff; backdrop-filter: blur(8px);
      transition: background-color 180ms ease, transform 140ms var(--ease-out);
    }
    .bookmark:active { transform: scale(.88); }
    .bookmark.on { background: var(--rose); }
    .bookmark.listed { background: #fff; color: var(--rose); }
    .bookmark .icon { font-size: 1rem; }
    .bookmark.pop { animation: pop 360ms var(--ease-out); }

    /* =========================================================
       DESCUBRIR
       ========================================================= */
    .feat {
      position: relative; overflow: hidden; border-radius: 28px;
      background: var(--night); color: #fff;
      min-height: 380px; display: flex; align-items: flex-end;
    }
    .feat-bg { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(30px) saturate(1.3); opacity: .6; }
    .feat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(18,13,22,.92) 25%, rgba(18,13,22,.35)); }
    .feat-body { position: relative; z-index: 1; display: flex; gap: 2rem; align-items: center; padding: 2rem; width: 100%; }
    .feat-poster { width: 190px; aspect-ratio: 2/3; object-fit: cover; border-radius: 18px; box-shadow: 0 24px 50px rgba(0,0,0,.5); flex-shrink: 0; transform: rotate(-2deg); }
    .feat-label { display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 600; color: #ffb3d2; margin-bottom: .6rem; }
    .feat h2 { font-size: clamp(1.8rem, 4.5vw, 3.2rem); line-height: 1; letter-spacing: -0.04em; margin-bottom: .75rem; max-width: 16ch; }
    .feat p { color: rgba(255,255,255,.75); font-size: .92rem; line-height: 1.55; max-width: 52ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1.25rem; }
    .feat-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .feat { min-height: 0; }
      .feat-body { flex-direction: column; align-items: flex-start; gap: 1.25rem; padding: 1.5rem; }
      .feat-poster { width: 120px; }
    }

    .chips { display: flex; gap: .45rem; overflow-x: auto; scrollbar-width: none; margin: 2rem 0 .5rem; padding: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      padding: .5rem 1rem; border-radius: 999px; white-space: nowrap;
      font-size: .82rem; font-weight: 700; color: var(--ink-2);
      background: var(--surface); border: 1px solid var(--line);
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
    }
    .chip-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }

    .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin: 2rem 0 .9rem; }
    .row-head h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.025em; }
    .row-head span { font-size: .8rem; color: var(--ink-3); }

    .skel { border-radius: var(--r-sm); aspect-ratio: 2/3; background: linear-gradient(100deg, var(--line) 30%, #f8f2f6 50%, var(--line) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
    .skel-feat { aspect-ratio: auto; height: 380px; border-radius: 28px; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    .notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 2rem; text-align: center; color: var(--ink-2); }
    .notice .btn { margin-top: 1rem; }

    /* ---------- Viendo ahora ---------- */
    .now {
      position: relative; overflow: hidden; border-radius: var(--r-lg);
      background: var(--ink); color: #fff;
      display: flex; align-items: center; gap: 1.25rem; padding: 1.25rem;
      text-align: left; width: 100%;
    }
    .now-bg { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; filter: blur(28px) saturate(1.2); opacity: .55; }
    .now::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(29,22,34,.9) 30%, rgba(29,22,34,.45)); }
    .now > *:not(.now-bg) { position: relative; z-index: 1; }
    .now-poster { width: 76px; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
    .now-label { display: inline-flex; align-items: center; gap: .4rem; font-size: .76rem; font-weight: 600; color: #ffb3d2; margin-bottom: .3rem; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 0 rgba(234,40,123,.6); animation: pulse 2s ease-out infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(234,40,123,0); } 100% { box-shadow: 0 0 0 0 rgba(234,40,123,0); } }
    .now h3 { font-size: 1.25rem; letter-spacing: -0.02em; line-height: 1.2; }
    .now p { font-size: .82rem; color: rgba(255,255,255,.7); margin-top: .25rem; }
    .now .chev { margin-left: auto; font-size: 1.25rem; opacity: .7; transition: transform 200ms var(--ease-out); }
    @media (hover: hover) and (pointer: fine) { .now:hover .chev { transform: translateX(3px); } }

    /* ---------- Filtros ---------- */
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; margin: 2.25rem 0 1.25rem; }
    .counts { display: flex; gap: 1.75rem; }
    .count { text-align: left; color: var(--ink-3); transition: color 160ms ease; }
    .count strong { display: block; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--ink-3); transition: color 160ms ease; }
    .count span { font-size: .8rem; font-weight: 600; }
    .count.active { color: var(--ink); }
    .count.active strong { color: var(--rose); }
    .seg { display: inline-flex; background: var(--field); padding: 3px; border-radius: 999px; }
    .seg button {
      padding: .45rem .95rem; border-radius: 999px; white-space: nowrap;
      font-size: .8rem; font-weight: 700; color: var(--ink-2);
      transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }
    .seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(29,22,34,.1); }
    .seg button small { font-weight: 600; color: var(--ink-3); margin-left: .2rem; }

    /* ---------- Grilla ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 2rem 1.25rem; }
    .card { min-width: 0; }
    .card-poster { position: relative; display: block; width: 100%; aspect-ratio: 2/3; border-radius: var(--r-md); overflow: hidden; background: var(--line); box-shadow: var(--shadow-1); }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease-out); }
    @media (hover: hover) and (pointer: fine) { .card-poster:hover img { transform: scale(1.04); } }
    .chip { position: absolute; left: 8px; top: 8px; font-size: .68rem; font-weight: 700; padding: .25rem .55rem; border-radius: 999px; background: rgba(255,255,255,.9); color: var(--ink); backdrop-filter: blur(6px); }
    .rank { position: absolute; right: 8px; top: 8px; min-width: 26px; height: 26px; padding: 0 .4rem; border-radius: 999px; background: var(--rose); color: #fff; font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
    .card-title { display: -webkit-box; text-align: left; margin-top: .75rem; font-size: .98rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; align-items: center; gap: .4rem; font-size: .76rem; color: var(--ink-3); margin-top: .2rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
    .dot.viendo { background: var(--rose); }
    .dot.deseo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rose); }

    .card-enter-active { transition: opacity 280ms var(--ease-out), transform 280ms var(--ease-out); transition-delay: calc(var(--i) * 35ms); }
    .card-enter-from { opacity: 0; transform: translateY(10px) scale(.98); }
    .card-leave-active { display: none; }
    .card-move { transition: transform 320ms var(--ease-in-out); }
    .empty { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--ink-2); }

    /* ---------- Lista de deseos ---------- */
    .wish { list-style: none; display: grid; gap: .6rem; }
    .wish-item {
      display: flex; align-items: center; gap: 1rem;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: .7rem .8rem .7rem .7rem; position: relative; overflow: hidden;
    }
    .wish-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pri); }
    .wish-item[data-p="alta"] { --pri: var(--rose); }
    .wish-item[data-p="media"] { --pri: var(--rose-soft); }
    .wish-item[data-p="baja"] { --pri: var(--star-off); }
    .wish-n { width: 1.6rem; text-align: center; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .wish-item img { width: 50px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; background: var(--line); cursor: pointer; }
    .wish-t { flex: 1; min-width: 0; text-align: left; }
    .wish-t strong { display: block; font-size: .96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wish-t span { font-size: .76rem; color: var(--ink-3); }
    .pri {
      font-size: .74rem; font-weight: 700; padding: .35rem .7rem; border-radius: 999px; white-space: nowrap;
      transition: background-color 180ms ease, color 180ms ease, transform 140ms var(--ease-out);
    }
    .pri:active { transform: scale(.94); }
    .pri[data-p="alta"] { background: var(--rose); color: #fff; }
    .pri[data-p="media"] { background: var(--rose-tint); color: var(--rose); }
    .pri[data-p="baja"] { background: var(--field); color: var(--ink-2); }
    .wish-actions { display: flex; align-items: center; gap: .1rem; }
    .wish-move { display: flex; flex-direction: column; }
    .wish-move .icon-btn { width: 28px; height: 22px; border-radius: 6px; }
    .wish-play { color: var(--rose); }
    .wish-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); margin-bottom: 1rem; }
    .wish-legend span { display: inline-flex; align-items: center; gap: .4rem; }
    .wish-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    @media (max-width: 560px) {
      .wish-item { gap: .65rem; }
      .wish-n { display: none; }
      .wish-item img { width: 42px; }
      .wish-actions .wish-x { display: none; }
      .wish-t strong { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: .9rem; line-height: 1.25; }
    }

    /* ---------- Estrellas ---------- */
    .stars { display: flex; align-items: center; gap: .35rem; margin-top: .45rem; }
    .stars-row { display: inline-flex; }
    .star { padding: 1px; color: var(--star-off); font-size: .82rem; line-height: 0; transition: color 120ms ease, transform 140ms var(--ease-out); }
    .star.on { color: var(--rose); }
    .star.preview { color: var(--rose-soft); }
    .star:active { transform: scale(.8); }
    .star.pop { animation: pop 320ms var(--ease-out); }
    @keyframes pop { 40% { transform: scale(1.35); } }
    .score { font-size: .74rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .stars.lg .star { font-size: 1.45rem; padding: 2px; }
    .stars.lg .score { font-size: .95rem; color: var(--ink); }

    /* =========================================================
       FAVORITOS
       ========================================================= */
    .h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: .3rem; }
    .lede { color: var(--ink-2); font-size: .9rem; margin-bottom: 1.5rem; }
    .podium { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 1rem; align-items: end; margin-bottom: 3rem; }
    .pod { position: relative; border-radius: var(--r-lg); overflow: hidden; text-align: left; color: #fff; aspect-ratio: 3/4; background: var(--ink); }
    .pod:first-child { aspect-ratio: 3/4.2; }
    .pod img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease-out); }
    @media (hover: hover) and (pointer: fine) { .pod:hover img { transform: scale(1.04); } }
    .pod-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,14,24,.92) 10%, rgba(20,14,24,0) 60%); }
    .pod-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.15rem; }
    .pod-num { font-size: 3.2rem; font-weight: 800; line-height: .8; letter-spacing: -0.06em; }
    .pod:first-child .pod-num { color: #ff7fb4; }
    .pod h3 { font-size: 1.1rem; letter-spacing: -0.015em; margin: .5rem 0 .2rem; line-height: 1.2; }
    .pod p { font-size: .78rem; color: rgba(255,255,255,.72); }
    @media (max-width: 720px) {
      .podium { grid-template-columns: 1fr 1fr; }
      .pod:first-child { grid-column: 1 / -1; aspect-ratio: 4/3; }
    }
    .ranking { list-style: none; margin-bottom: 3rem; }
    .ranking li + li { border-top: 1px solid var(--line); }
    .rank-row { width: 100%; display: flex; align-items: center; gap: 1rem; padding: .75rem .25rem; text-align: left; border-radius: var(--r-sm); transition: background-color 160ms ease; }
    @media (hover: hover) and (pointer: fine) { .rank-row:hover { background: var(--surface); } }
    .rank-n { width: 2rem; font-size: 1.05rem; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .rank-row img { width: 44px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; background: var(--line); }
    .rank-t { flex: 1; min-width: 0; }
    .rank-t strong { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-t span { font-size: .78rem; color: var(--ink-3); }
    .rank-s { font-weight: 800; color: var(--rose); font-size: .9rem; display: flex; align-items: center; gap: .25rem; }
    .actors { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1.5rem 1rem; }
    .actor { text-align: center; }
    .actor img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; margin: 0 auto .6rem; background: var(--line); }
    .actor strong { display: block; font-size: .86rem; line-height: 1.25; }
    .actor span { font-size: .74rem; color: var(--ink-3); }

    /* =========================================================
       WRAPPED — pantalla completa, una escena por pantalla
       ========================================================= */
    .wr {
      position: fixed; inset: 0; z-index: 150;
      background: var(--night); color: #fff;
      overflow-y: auto; overscroll-behavior: contain;
      scroll-snap-type: y mandatory; scrollbar-width: none;
    }
    .wr::-webkit-scrollbar { display: none; }
    .wr-enter-active { transition: opacity 400ms var(--ease-out), transform 500ms var(--ease-drawer); }
    .wr-leave-active { transition: opacity 250ms ease, transform 250ms ease; }
    .wr-enter-from, .wr-leave-to { opacity: 0; transform: scale(1.03); }

    .wr-chrome { position: fixed; z-index: 160; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(1rem + env(safe-area-inset-top)) 1.25rem 1rem; pointer-events: none; }
    .wr-chrome > * { pointer-events: auto; }
    .wr-chrome .logo { font-size: 1.05rem; color: #fff; }
    .wr-chrome .logo-bar { background: #fff; }
    .wr-close { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.14); backdrop-filter: blur(12px); display: grid; place-items: center; font-size: 1.15rem; transition: background-color 160ms ease, transform 140ms var(--ease-out); }
    .wr-close:active { transform: scale(.9); }
    .wr-progress { position: fixed; z-index: 160; right: 1rem; top: 50%; transform: translateY(-50%); display: grid; gap: 8px; }
    .wr-progress button { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); transition: transform 300ms var(--ease-out), background-color 300ms ease; padding: 0; }
    .wr-progress button.on { background: #fff; transform: scale(1.6); }
    @media (max-width: 640px) { .wr-progress { right: .6rem; } }

    .ws {
      position: relative; height: 100dvh; min-height: 560px;
      scroll-snap-align: start; scroll-snap-stop: always;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .ws-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.15); transition: transform 2200ms var(--ease-out); }
    .ws.in .ws-bg { transform: scale(1); }
    .ws-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,13,22,.96) 12%, rgba(18,13,22,.25) 58%, rgba(18,13,22,.45)); }
    .ws-content { position: relative; z-index: 2; width: 100%; max-width: 1100px; margin: auto auto 0; padding: 6rem 1.5rem calc(3.5rem + env(safe-area-inset-bottom)); }
    .ws-content.mid { margin: auto; text-align: center; padding-bottom: 4rem; }
    .rv { opacity: 0; transform: translateY(30px); transition: opacity 800ms var(--ease-out), transform 900ms var(--ease-out); transition-delay: var(--d, 0ms); }
    .ws.in .rv { opacity: 1; transform: none; }

    .ws-kicker { font-size: clamp(.95rem, 1.6vw, 1.15rem); font-weight: 600; color: rgba(255,255,255,.75); margin-bottom: .75rem; }
    .ws-giant { font-size: clamp(4.2rem, 17vw, 12rem); font-weight: 800; letter-spacing: -0.065em; line-height: .84; }
    .ws-big { font-size: clamp(2.6rem, 8vw, 6rem); font-weight: 800; letter-spacing: -0.05em; line-height: .92; }
    .ws-text { font-size: clamp(1.05rem, 2vw, 1.35rem); line-height: 1.45; color: rgba(255,255,255,.85); max-width: 34ch; margin-top: 1rem; }
    .ws-content.mid .ws-text { margin-inline: auto; }

    /* Escena 1: muro de pósters en movimiento */
    .mq { position: absolute; inset: -20% -10%; display: flex; gap: 14px; transform: rotate(-10deg); opacity: .55; }
    .mq-col { flex: 1; display: flex; flex-direction: column; gap: 14px; animation: mq var(--dur) linear infinite; animation-direction: var(--dir); }
    .mq-col img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 14px; background: #2a2030; }
    @keyframes mq { to { transform: translateY(-50%); } }
    .ws-intro .ws-shade { background: radial-gradient(ellipse at center, rgba(18,13,22,.55), rgba(18,13,22,.95) 75%); }
    .ws-intro .ws-giant > .w { display: block; margin: 0; }
    .ws-intro .ws-giant .yr { display: block; color: var(--rose); }
    .ws-hint { position: absolute; z-index: 2; left: 50%; bottom: calc(1.75rem + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .3rem; font-size: .8rem; color: rgba(255,255,255,.7); }
    .ws-hint .icon { animation: nudge 1.8s var(--ease-in-out) infinite; font-size: 1.2rem; }
    @keyframes nudge { 50% { transform: translateY(6px); } }

    /* Escena 2: conteo */
    .ws-count { background: var(--rose); }
    .ws-count .float { position: absolute; width: clamp(110px, 16vw, 200px); aspect-ratio: 2/3; object-fit: cover; border-radius: 18px; box-shadow: 0 30px 60px rgba(70, 0, 30, .35); }
    .ws-count .float.rv { transform: translateY(60px) rotate(var(--r)); }
    .ws.in .float.rv { transform: rotate(var(--r)); }
    .ws-count .ws-giant { font-size: clamp(7rem, 30vw, 20rem); font-variant-numeric: tabular-nums; }

    /* Escena 3: balance */
    .ws-split { background: var(--night); }
    .split-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 2rem 0 1.5rem; }
    .split-nums strong { display: block; font-size: clamp(4rem, 13vw, 9rem); font-weight: 800; letter-spacing: -0.06em; line-height: .85; }
    .split-nums span { font-size: 1rem; color: rgba(255,255,255,.7); }
    .split-nums div:first-child strong { color: var(--rose); }
    .split-bar { display: flex; height: 18px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.12); }
    .split-bar i { display: block; height: 100%; transform: scaleX(0); transform-origin: left; transition: transform 1400ms var(--ease-out) 400ms; }
    .split-bar i:first-child { background: var(--rose); }
    .split-bar i:last-child { background: #fff; transform-origin: right; }
    .ws.in .split-bar i { transform: scaleX(1); }

    /* Escena 4: género */
    .ws-genre .ws-shade { background: linear-gradient(160deg, rgba(234,40,123,.85), rgba(80,10,45,.9) 60%, rgba(18,13,22,.95)); }
    .genre-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .genre-chips span { padding: .45rem .9rem; border-radius: 999px; background: rgba(255,255,255,.16); font-size: .86rem; font-weight: 600; }

    /* Escenas 5-7: tu top */
    .ws-top .rank-ghost { position: absolute; z-index: 1; right: -2vw; top: 8vh; font-size: clamp(16rem, 48vw, 34rem); font-weight: 800; line-height: .8; letter-spacing: -0.08em; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.35); }
    .ws-top h2 { font-size: clamp(2.8rem, 8.5vw, 6.5rem); font-weight: 800; letter-spacing: -0.05em; line-height: .92; max-width: 13ch; }
    .ws-top .meta { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin-top: 1.1rem; font-size: 1rem; color: rgba(255,255,255,.8); }
    .ws-top .meta b { color: #fff; }
    .ws-stars { display: inline-flex; gap: 3px; color: var(--rose); font-size: 1.1rem; vertical-align: -2px; }
    .ws-stars .off { color: rgba(255,255,255,.25); }
    .ws-quote { font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-style: italic; font-weight: 700; line-height: 1.35; max-width: 32ch; margin-top: 1.5rem; padding-left: 1rem; border-left: 3px solid var(--rose); }
    .ws-note { font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.7); max-width: 52ch; margin-top: 1rem; }
    .ws-first .ws-kicker { color: #ff9ec7; }
    .ws-poster-wrap { display: none; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
      .ws-top .ws-bg, .ws-actor .ws-bg { filter: blur(36px) brightness(.55) saturate(1.3); }
      .ws-top .ws-shade { background: linear-gradient(90deg, rgba(18,13,22,.9) 20%, rgba(18,13,22,.1)); }
      .ws-top .ws-content { margin: auto; padding-right: 44%; }
      .ws-poster-wrap { display: block; position: absolute; z-index: 2; right: 8vw; top: 50%; height: 74vh; aspect-ratio: 2/3; transform: translateY(-50%) rotate(3deg); }
      .ws-poster-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 26px; box-shadow: 0 40px 90px rgba(0,0,0,.55); }
      .ws-top .rank-ghost { right: auto; left: 30vw; }
    }

    /* Escena: actor */
    .ws-actor .ws-bg { filter: blur(24px) brightness(.5); }
    .actor-face { width: clamp(180px, 34vw, 280px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; margin: 0 auto 2rem; box-shadow: 0 0 0 6px var(--night), 0 0 0 9px var(--rose), 0 30px 80px rgba(0,0,0,.5); background: #2a2030; }
    .ws-actor .rv.actor-face { transform: scale(.9); }
    .ws-actor.in .rv.actor-face { transform: none; }
    .others { display: flex; justify-content: center; margin-top: 2rem; }
    .others img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 3px solid var(--night); margin-left: -12px; background: #2a2030; }

    /* Escena: frase */
    .ws-quote-s { background: #ffe1ee; color: var(--ink); }
    .qmark { font-size: clamp(9rem, 24vw, 16rem); line-height: .6; font-weight: 800; color: var(--rose); height: .45em; }
    .big-quote { font-size: clamp(1.9rem, 5vw, 3.6rem); font-weight: 700; font-style: italic; letter-spacing: -0.03em; line-height: 1.12; max-width: 20ch; margin: 0 auto; }
    .ws-quote-s .ws-kicker { color: var(--ink-2); }
    .quote-src { margin-top: 1.5rem; font-weight: 700; color: var(--rose); }

    /* Escena: mes */
    .ws-month { background: linear-gradient(180deg, var(--night), #2a0f22); }
    .months { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: clamp(4px, 1vw, 12px); height: min(34vh, 260px); margin-top: 2.5rem; }
    .months div { display: flex; flex-direction: column; align-items: center; gap: .5rem; height: 100%; justify-content: flex-end; }
    .months i { display: block; width: 100%; border-radius: 8px 8px 3px 3px; background: rgba(255,255,255,.18); height: var(--h); min-height: 6px; transform: scaleY(0); transform-origin: bottom; transition: transform 1000ms var(--ease-out); transition-delay: calc(300ms + var(--k) * 50ms); }
    .months div.top i { background: var(--rose); }
    .ws.in .months i { transform: scaleY(1); }
    .months span { font-size: .72rem; color: rgba(255,255,255,.55); font-weight: 600; }
    .months div.top span { color: #fff; }

    /* Escena final: tarjeta resumen */
    .ws-sum { background: radial-gradient(120% 80% at 50% 0%, #6d1844 0%, var(--night) 65%); align-items: center; justify-content: center; }
    .sum-card {
      position: relative; z-index: 2;
      width: min(400px, calc(100vw - 2.5rem));
      background: linear-gradient(165deg, var(--rose) 0%, #b0145a 55%, #4a0d2f 100%);
      border-radius: 30px; padding: 1.5rem; margin: 5rem auto 1.5rem;
      box-shadow: 0 40px 100px rgba(0,0,0,.5);
    }
    .sum-posters { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1.25rem; }
    .sum-posters img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; background: rgba(0,0,0,.2); }
    .sum-posters img:nth-child(2) { transform: translateY(-10px); }
    .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1rem; }
    .sum-grid small { display: block; font-size: .72rem; font-weight: 600; color: rgba(255,255,255,.7); margin-bottom: .15rem; }
    .sum-grid b { font-size: .95rem; line-height: 1.2; display: block; }
    .sum-grid .num { font-size: 2rem; letter-spacing: -0.04em; line-height: 1; }
    .sum-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.2); font-size: .8rem; font-weight: 700; }
    .sum-actions { position: relative; z-index: 2; display: flex; gap: .6rem; justify-content: center; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }

    /* =========================================================
       PERFIL + JOURNAL (modal)
       ========================================================= */
    .backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(20, 14, 24, .55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
    .sheet { width: 100%; max-width: 760px; max-height: 92dvh; background: var(--surface); border-radius: 28px; overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--shadow-pop); }
    .modal-enter-active, .modal-leave-active { transition: opacity 240ms ease; }
    .modal-enter-active .sheet { transition: transform 320ms var(--ease-drawer), opacity 240ms var(--ease-out); }
    .modal-leave-active .sheet { transition: transform 200ms ease, opacity 200ms ease; }
    .modal-enter-from, .modal-leave-to { opacity: 0; }
    .modal-enter-from .sheet, .modal-leave-to .sheet { opacity: 0; transform: scale(.96) translateY(8px); }
    @media (max-width: 640px) {
      .backdrop { align-items: flex-end; padding: 0; }
      .sheet { border-radius: 24px 24px 0 0; max-height: 94dvh; }
      .modal-enter-active .sheet { transition: transform 420ms var(--ease-drawer); }
      .modal-enter-from .sheet, .modal-leave-to .sheet { opacity: 1; transform: translateY(100%); }
    }
    .hero { position: relative; height: 320px; background: var(--ink); overflow: hidden; }
    .hero-bg { width: 100%; height: 100%; object-fit: cover; opacity: .8; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,14,24,.95) 8%, rgba(20,14,24,.25) 60%, rgba(20,14,24,.15)); }
    .hero-close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 1.1rem; transition: background-color 160ms ease, transform 140ms var(--ease-out); }
    .hero-close:active { transform: scale(.92); }
    .hero-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.5rem; display: flex; align-items: flex-end; gap: 1.1rem; color: #fff; }
    .hero-poster { width: 104px; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
    .hero h2 { font-size: clamp(1.4rem, 3.5vw, 2rem); letter-spacing: -0.03em; line-height: 1.08; margin: .3rem 0 .4rem; }
    .hero-meta { font-size: .82rem; color: rgba(255,255,255,.75); }
    .hero-kind { font-size: .76rem; font-weight: 600; color: #ffb3d2; }
    .sheet-body { padding: 1.5rem; }
    .synopsis { color: var(--ink-2); line-height: 1.65; font-size: .92rem; max-width: 65ch; }
    .block-title { font-size: .95rem; font-weight: 800; margin: 1.75rem 0 .85rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .block-title small { font-weight: 500; font-size: .78rem; color: var(--ink-3); }
    .cast { display: flex; gap: 1rem; overflow-x: auto; padding: 4px 2px .5rem; scrollbar-width: none; }
    .cast::-webkit-scrollbar { display: none; }
    .cast-item { width: 76px; flex-shrink: 0; text-align: center; }
    .cast-item img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin: 0 auto .4rem; background: var(--line); transition: box-shadow 200ms var(--ease-out), transform 140ms var(--ease-out); }
    .cast-item:active img { transform: scale(.95); }
    .cast-item.picked img { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--rose); }
    .cast-item strong { display: block; font-size: .72rem; line-height: 1.2; }
    .cast-item span { font-size: .66rem; color: var(--ink-3); }
    .journal { background: var(--paper); border-radius: var(--r-lg); padding: 1.35rem; margin-top: 1.75rem; }
    .journal-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .journal-head h3 { font-size: 1.15rem; letter-spacing: -0.02em; }
    .badge-new { font-size: .72rem; font-weight: 700; color: var(--rose); background: var(--rose-tint); padding: .3rem .7rem; border-radius: 999px; }
    .field { margin-bottom: 1rem; }
    .field label, .field .lbl { display: block; font-size: .78rem; font-weight: 700; color: var(--ink-2); margin-bottom: .4rem; }
    .input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: .75rem .9rem; font: inherit; font-size: 1rem; color: var(--ink); outline: none; transition: border-color 160ms ease, box-shadow 160ms ease; }
    .input:focus { border-color: #f1bcd3; box-shadow: 0 0 0 4px var(--rose-tint); }
    textarea.input { min-height: 120px; resize: vertical; line-height: 1.55; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .seg.full { display: flex; }
    .seg.full button { flex: 1; }
    .rating-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: .9rem 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .rating-box .lbl { font-size: .86rem; font-weight: 700; }
    .rating-box .stars { margin: 0; }
    .fold-enter-active { transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out); }
    .fold-enter-from { opacity: 0; transform: translateY(-6px); }
    @media (max-width: 560px) { .stars.lg .star { font-size: 1.1rem; padding: 1px; } .cols { grid-template-columns: 1fr; } .hero { height: 280px; } .hero-poster { width: 84px; } }

    /* ---------- Toast ---------- */
    .toast { position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom)); z-index: 200; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .75rem 1.1rem; border-radius: 999px; font-size: .86rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; box-shadow: 0 12px 30px rgba(29,22,34,.25); white-space: nowrap; }
    .toast .icon { color: #ff8fbe; }
    .toast-enter-active, .toast-leave-active { transition: transform 300ms var(--ease-out), opacity 300ms var(--ease-out); }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(-50%) translateY(120%); }
    .view-enter-active { transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out); }
    .view-enter-from { opacity: 0; transform: translateY(6px); }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .topbar-inner { flex-wrap: wrap; gap: .75rem; padding-bottom: .6rem; }
      .tabs { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem .9rem; }
      .counts { gap: 1.25rem; }
      .count strong { font-size: 1.6rem; }
      .search .btn span { display: none; }
      .now-poster { width: 60px; }
      .row { grid-auto-columns: 128px; }
      .now-row.many { grid-auto-columns: 86%; }
      .t10 { grid-auto-columns: 200px; }
      .section-head .seg { width: 100%; overflow-x: auto; }
    }

    /* ---------- Movimiento reducido ---------- */
    /* =========================================================
       ANIMACIONES EXTRA
       ========================================================= */
    /* Inclinación 3D al pasar el mouse */
    .tilt { transform-style: preserve-3d; will-change: transform; }
    .tilt .glare { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.32), transparent 55%); opacity: 0; transition: opacity 300ms ease; }
    .tilt:hover .glare { opacity: 1; }

    /* Explosión de corazones */
    .burst { position: fixed; z-index: 400; width: 0; height: 0; pointer-events: none; }
    .burst i { position: absolute; left: 0; top: 0; display: block; animation: burst 950ms var(--ease-out) forwards; }
    .burst svg { width: 100%; height: 100%; display: block; }
    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(.2) rotate(0deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity: 0; }
    }

    /* Títulos que entran palabra por palabra */
    .split .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .08em .1em 0; margin: -.14em .12em -.1em 0; }
    .split .w > span { display: inline-block; transform: translateY(108%) rotate(4deg); transform-origin: left bottom; transition: transform 900ms var(--ease-out); transition-delay: calc(var(--d, 0ms) + var(--w) * 70ms); }
    .split.chars .w { margin-right: -.08em; }
    .ws.in .split .w > span { transform: none; }

    /* Brillo que cruza */
    .shine { position: relative; overflow: hidden; }
    .shine::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.4) 50%, transparent 65%); transform: translateX(-120%); }
    .ws.in .shine::after { animation: shine 1500ms var(--ease-in-out) 700ms both; }
    @keyframes shine { to { transform: translateX(120%); } }

    /* Parallax en el Wrapped */
    .ws-media { position: absolute; inset: -12% 0; will-change: transform; }

    /* Póster destacado flotando */
    .feat-poster { animation: floaty 6s ease-in-out infinite; }
    @keyframes floaty { 50% { transform: rotate(-2deg) translateY(-10px); } }

    /* Entrada escalonada del perfil */
    .m-rv { animation: rise 560ms var(--ease-out) both; animation-delay: calc(140ms + var(--k, 0) * 70ms); }
    .hero-bg { animation: kenburns 16s ease-out both; }
    @keyframes kenburns { from { transform: scale(1.18); } }
    .hero-poster { animation: poster-in 800ms var(--ease-out) 120ms both; }
    @keyframes poster-in { from { opacity: 0; transform: translateY(24px) rotate(-6deg) scale(.9); } }
    .hero h2, .hero-kind, .hero-meta { animation: rise 600ms var(--ease-out) both; }
    .hero-kind { animation-delay: 180ms; } .hero h2 { animation-delay: 240ms; } .hero-meta { animation-delay: 300ms; }

    /* =========================================================
       JOURNAL VISUAL
       ========================================================= */
    .jv-grid { display: grid; grid-template-columns: 170px 1fr; gap: .8rem; margin-bottom: 1rem; }
    .ring-card, .time-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem; }
    .ring-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; text-align: center; }
    .ring { width: 104px; height: 104px; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; }
    .ring-bg { stroke: var(--field); }
    .ring-fg { stroke: url(#ringGrad); stroke-linecap: round; stroke-dasharray: 213.63; transition: stroke-dashoffset 1000ms var(--ease-out); }
    .ring-num { position: absolute; top: calc(1rem + 52px); left: 50%; transform: translate(-50%, -50%); line-height: 1; }
    .ring-num strong { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; }
    .ring-num span { font-size: .8rem; color: var(--ink-3); font-weight: 700; }
    .ring-card .lbl, .time-card .lbl { font-size: .78rem; font-weight: 700; color: var(--ink-2); margin-top: .5rem; }
    .time-card .lbl { margin: 0 0 1rem; }
    .tl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .75rem; }
    .tl-end { display: grid; justify-items: start; gap: .1rem; }
    .tl-end.end { justify-items: end; text-align: right; }
    .tl-end i { width: 12px; height: 12px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 4px var(--rose-tint); margin-bottom: .35rem; }
    .tl-end.open i { background: var(--surface); border: 2px solid var(--rose); animation: pulse 2s ease-out infinite; }
    .tl-end small { font-size: .7rem; color: var(--ink-3); font-weight: 600; }
    .tl-end b { font-size: .92rem; letter-spacing: -0.01em; }
    .tl-line { position: relative; height: 4px; border-radius: 99px; background: var(--field); margin-bottom: 1.6rem; }
    .tl-line span { position: absolute; inset: 0; border-radius: 99px; background: linear-gradient(90deg, var(--rose), var(--rose-soft)); transform-origin: left; transition: transform 1000ms var(--ease-out) 200ms; }
    .tl-line span.live { background: repeating-linear-gradient(90deg, var(--rose) 0 8px, var(--rose-soft) 8px 14px); background-size: 28px 100%; animation: march 1s linear infinite; }
    @keyframes march { to { background-position: 28px 0; } }
    .tl-line em { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-style: normal; font-size: .76rem; font-weight: 700; color: var(--rose); white-space: nowrap; }
    .tl-inputs { margin-top: 1rem; gap: .5rem; }
    .tl-inputs .input { padding: .5rem .6rem; font-size: .85rem; }
    .jv-grid > *, .tl-inputs > *, .cols > * { min-width: 0; }
    @media (max-width: 560px) { .jv-grid { grid-template-columns: 1fr; } .tl-inputs { grid-template-columns: 1fr 1fr; } }

    .moods { display: flex; flex-wrap: wrap; gap: .45rem; }
    .mood { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .85rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .82rem; font-weight: 700; color: var(--ink-2); transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, transform 140ms var(--ease-out); }
    .mood .icon { color: var(--c); font-size: 1rem; transition: color 200ms ease; }
    .mood:active { transform: scale(.94); }
    .mood.on { background: var(--c); border-color: var(--c); color: #fff; }
    .mood.on .icon { color: #fff; animation: pop 380ms var(--ease-out); }

    .quote-field { position: relative; background: linear-gradient(135deg, var(--rose-tint), #fff6fa); border: 1px solid #f7d3e3; border-radius: var(--r-md); padding: 1.1rem 1.1rem 1.1rem 3.4rem; }
    .quote-field > span { position: absolute; left: .9rem; top: .2rem; font-size: 4rem; line-height: 1; font-weight: 800; color: var(--rose); }
    .quote-input { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1.15rem; font-weight: 700; font-style: italic; letter-spacing: -0.01em; color: var(--ink); }
    .quote-input::placeholder { color: #d9a5bd; }
    .actor-field { display: flex; align-items: center; gap: .75rem; }
    .actor-field img, .actor-ph { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--rose); animation: pop 400ms var(--ease-out); }
    .actor-ph { display: grid; place-items: center; background: var(--rose-tint); color: var(--rose); font-weight: 800; box-shadow: none; animation: none; }
    .paper {
      min-height: 200px; line-height: 32px; padding: 0 1rem 0 2.9rem !important;
      background-color: #fffdfe;
      background-image: linear-gradient(90deg, transparent 2.2rem, #f6b8d2 2.2rem, #f6b8d2 calc(2.2rem + 1.5px), transparent calc(2.2rem + 1.5px)), repeating-linear-gradient(to bottom, transparent 0 31px, #f3e3eb 31px 32px);
      background-attachment: local;
    }

    /* =========================================================
       WRAPPED: NUEVAS ESCENAS
       ========================================================= */
    .ws-count-se { background: #ffe1ee; color: var(--ink); }
    .wr-chrome, .wr-progress button { transition: color 300ms ease, background-color 300ms ease, transform 300ms var(--ease-out); }
    .wr.light-ui .wr-chrome .logo { color: var(--ink); }
    .wr.light-ui .wr-chrome .logo-bar { background: var(--rose); }
    .wr.light-ui .wr-close { background: rgba(29,22,34,.08); color: var(--ink); }
    .wr.light-ui .wr-progress button { background: rgba(29,22,34,.2); }
    .wr.light-ui .wr-progress button.on { background: var(--ink); }
    .ws-count-se .ws-kicker { color: var(--ink-2) !important; }
    .ws-count-se .ws-giant { color: var(--rose); }
    .ws-count-se .ws-text { color: var(--ink) !important; }
    .ws-count .ws-big { margin-top: .25rem; }
    .ws-count .float.rv { transform: translateY(80px) rotate(calc(var(--r) * -2)) scale(.85); transition-duration: 1200ms; }

    .ws-gmap { background: radial-gradient(100% 70% at 0% 100%, #4a0d2f 0%, var(--night) 60%); }
    .gmap { list-style: none; display: grid; gap: .9rem; margin-top: 2rem; }
    .gmap li { display: grid; grid-template-columns: 130px 1fr 2.5rem minmax(0, 230px); align-items: center; gap: 1rem; }
    .gm-name { font-weight: 800; font-size: 1.05rem; }
    .gm-bar { height: 14px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
    .gm-bar i { display: block; height: 100%; width: var(--w); border-radius: 99px; background: linear-gradient(90deg, var(--rose), #ff9ec7); transform: scaleX(0); transform-origin: left; transition: transform 1200ms var(--ease-out); transition-delay: calc(500ms + var(--k) * 110ms); }
    .gmap li:first-child .gm-bar i { background: linear-gradient(90deg, #fff, #ffd1e4); }
    .ws.in .gm-bar i { transform: scaleX(1); }
    .gm-n { font-weight: 800; font-size: 1.3rem; text-align: right; font-variant-numeric: tabular-nums; }
    .gm-best { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .gm-best img { width: 36px; aspect-ratio: 2/3; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .gm-best span { font-size: .84rem; font-weight: 700; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gm-best small { display: block; font-size: .68rem; font-weight: 600; color: rgba(255,255,255,.55); }
    @media (max-width: 700px) {
      .gmap { gap: 1rem; margin-top: 1.5rem; }
      .gmap li { grid-template-columns: 1fr auto; gap: .35rem .75rem; }
      .gm-bar { grid-column: 1 / -1; grid-row: 2; height: 10px; }
      .gm-best { grid-column: 1 / -1; }
      .gm-best img { width: 24px; }
    }

    .ws-mood { background: radial-gradient(90% 70% at 50% 40%, color-mix(in srgb, var(--mc) 70%, #000) 0%, var(--night) 70%); }
    .mood-icon { width: clamp(120px, 22vw, 170px); aspect-ratio: 1; border-radius: 50%; margin: 0 auto 2rem; display: grid; place-items: center; background: var(--mc); color: #fff; box-shadow: 0 0 0 12px color-mix(in srgb, var(--mc) 30%, transparent), 0 0 0 28px color-mix(in srgb, var(--mc) 12%, transparent); }
    .mood-icon svg { width: 46%; height: 46%; }
    .ws.in .mood-icon svg { animation: heartbeat 1.6s ease-in-out 1s infinite; }
